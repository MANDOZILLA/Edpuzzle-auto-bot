<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 480px;
      margin: 40px auto;
      padding: 24px;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    h2 {
      color: #fff;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: #999;
      margin-bottom: 20px;
    }
    label {
      font-size: 13px;
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #16213e;
      color: #e0e0e0;
      font-size: 14px;
      box-sizing: border-box;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #22c55e;
    }
    button {
      margin-top: 16px;
      padding: 10px 24px;
      background: #22c55e;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #16a34a;
    }
    .msg {
      margin-top: 12px;
      font-size: 13px;
      color: #22c55e;
    }
    a {
      color: #8b8bc4;
    }
  </style>
</head>
<body>
  <h2>EPZ Auto Answerer Settings</h2>
  <p>Get a free API key from <a href="https://openrouter.ai/keys" target="_blank">openrouter.ai/keys</a></p>
  <label for="apiKey">OpenRouter API Key</label>
  <input type="text" id="apiKey" placeholder="sk-or-v1-...">
  <button id="save">Save</button>
  <div class="msg" id="msg"></div>
  <script src="settings.js"></script>
</body>
</html>
