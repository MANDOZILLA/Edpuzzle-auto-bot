<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 220px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    h3 {
      margin: 0 0 12px;
      font-size: 14px;
      color: #fff;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .toggle-label {
      font-size: 13px;
    }
    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
    }
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      inset: 0;
      background: #444;
      border-radius: 22px;
      cursor: pointer;
      transition: 0.2s;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.2s;
    }
    input:checked + .slider {
      background: #22c55e;
    }
    input:checked + .slider::before {
      transform: translateX(18px);
    }
    .settings-link {
      font-size: 12px;
      color: #8b8bc4;
      cursor: pointer;
      text-decoration: underline;
    }
    .status {
      font-size: 11px;
      margin-top: 8px;
      color: #888;
    }
  </style>
</head>
<body>
  <h3>EPZ Auto Answerer</h3>
  <div class="toggle-row">
    <span class="toggle-label">Enabled</span>
    <label class="toggle">
      <input type="checkbox" id="toggle" checked>
      <span class="slider"></span>
    </label>
  </div>
  <span class="settings-link" id="openSettings">API Key Settings</span>
  <div class="status" id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
